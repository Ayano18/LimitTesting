<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Testing</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}
body{
    background: #001e4d;
}
.app{
    background: #fff;
    width: 90%;
    max-width: 600px;
    margin: 100px auto 0;
    border-radius: 10px;
    padding: 30px;
}
.app h1{
    font-size: 25px;
    color: #001e4d;
    font-weight: 600;
    border-bottom: 1px solid #333;
    padding-bottom: 30px;
}
.quiz{
    padding: 20px 0;
}
.quiz h2{
    font-size: 18px;
    color: #001e4d;
    font-weight: 600;
}
.btn{
    background: #fff;
    color: #222;
    font-weight: 500;
    width: 100%;
    border: 1px solid #222;
    padding: 10px;
    margin: 10px 0;
    text-align: left;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover:not([disabled]){
    background: #222;
    color: #fff;
}
.btn:disabled{
    cursor: no-drop;
}
#next-btn{
    background: #001e4d;
    color: #fff;
    font-weight: 500;
    width: 150px;
    border: 0;
    padding: 10px;
    margin: 20px auto 0;
    border-radius: 4px;
    cursor: pointer;
    display: none;
}
.correct{
    background: #9aeabc;
}
.incorrect{
    background: #ff9393;
}
    </style>
</head>

<body>
    
    <div class="app">
            <h1>Handout </h1>
            <div class="quiz">
                <h2 id="question">Question Goes Here</h2>
                <div id="answer-buttons">
                    <button class="btn">Answer 1</button>
                    <button class="btn">Answer 2</button>
                    <button class="btn">Answer 3</button>
                    <button class="btn">Answer 4</button>
                    <button class="btn">Answer 5</button>
                    <button class="btn">Answer 6</button>
                    <button class="btn">Answer 7</button>
                    <button class="btn">Answer 8</button>
                    <button class="btn">Answer 9</button>
                    <button class="btn">Answer 10</button>
                </div>
                <button id="next-btn">Next</button>
            </div>
        </div>

</body>
<script>

    const questions = [
    {
        question: "What period of literature focused on reason, logic, social critique, and moral order?",
        answers: [
            { text: "Romanticism", correct: false},
            { text: "Enlightenment and Neoclassical Literature", correct: true},
            { text: "The Renaissance", correct: false},
            { text: "Modernism", correct: false},
        ]
    },
    {
        question: "Which movement encouraged people to think carefully, question authority, and explore the world through science?",
        answers: [
            { text: "The Enlightenment", correct: true},
            { text: "Neoclassicism", correct: false},
            { text: "Feudalism", correct: false},
            { text: "Traditionalism", correct: false},
        ]
    },
    {
        question: "Which movement revived ancient Greek and Roman literary forms, valuing clarity and balance?",
        answers: [
            { text: "The Enlightenment", correct: false},
            { text: "Post-Modernism", correct: false},
            { text: "Neoclassicism", correct: true},
            { text: "The Dark Ages", correct: false},
        ]
    },
    {
        question: "In this era, what promotes critical thinking to challenge traditions and encourage reform?",
        answers: [
            { text: "Satire", correct: false},
            { text: "Reason", correct: true},
            { text: "Inheritance", correct: false},
            { text: "Static Semantics", correct: false},
        ]
    },
    {
        question: "Which French writer used the novella 'Candide' to critique blind optimism and social injustice?",
        answers: [
            { text: "Jonathan Swift", correct: false},
            { text: "Voltaire", correct: true},
            { text: "Jean-Jacques Rousseau", correct: false},
            { text: "John Milton", correct: false},
        ]
    },
    {
        question: "What literary form employs humor, irony, and exaggeration to reveal societal flaws?",
        answers: [
            { text: "Satire", correct: true},
            { text: "Reason", correct: false},
            { text: "Dynamic Semantics", correct: false},
            { text: "Ode", correct: false},
        ]
    },
    {
        question: "Who wrote 'A Modest Proposal,' ironically suggesting a shocking solution to famine to critique society?",
        answers: [
            { text: "Voltaire", correct: false},
            { text: "Jonathan Swift", correct: true},
            { text: "William Wordsworth", correct: false},
            { text: "Alexander Pope", correct: false},
        ]
    }
];
    

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

const questionElement = document.getElementById("question");
const answerButtons = document.getElementById("answer-buttons");
const nextButton = document.getElementById("next-btn");

let currentQuestionIndex = 0;
let score = 0;

function startQuiz(){
    currentQuestionIndex = 0;
    score = 0;
    nextButton.innerHTML = "Next";

    shuffle(questions);
    questions.forEach(q => shuffle(q.answers));

    showQuestion();
}

function showQuestion(){
    resetState();
    let currentQuestion = questions[currentQuestionIndex];
    let questionNo = currentQuestionIndex + 1;
    questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

    currentQuestion.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerHTML = answer.text;
        button.classList.add("btn");
        answerButtons.appendChild(button);
        if(answer.correct){
            button.dataset.correct = answer.correct;
        }
        button.addEventListener("click", selectAnswer);
    });
}


function resetState(){
    nextButton.style.display = "none";
    while(answerButtons.firstChild){
        answerButtons.removeChild(answerButtons.firstChild);
    }
}

function selectAnswer(e){
    const selectedBtn = e.target;
    const isCorrect = selectedBtn.dataset.correct === "true";
    if(isCorrect){
        selectedBtn.classList.add("correct");
        score++;
    }else{
        selectedBtn.classList.add("incorrect");
    }
    Array.from(answerButtons.children).forEach(button => {
        if(button.dataset.correct === "true"){
            button.classList.add("correct");
        }
        button.disabled = true;
    });
    nextButton.style.display = "block";
}

function showScore(){
    resetState();
    questionElement.innerHTML = `You scored ${score} out of ${questions.length}!`;
    nextButton.innerHTML = "Play Again";
    nextButton.style.display = "block";
}

function handleNextButton(){
    currentQuestionIndex++;
    if(currentQuestionIndex < questions.length){
        showQuestion();
    }else{
        showScore();
    }
}


nextButton.addEventListener("click", ()=>{
    if(currentQuestionIndex < questions.length){
        handleNextButton();
    }else{
        startQuiz();
    }
});


startQuiz();

</script>
</html>
