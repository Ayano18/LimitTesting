<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Testing</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}
body{
    background: #001e4d;
}
.app{
    background: #fff;
    width: 90%;
    max-width: 600px;
    margin: 100px auto 0;
    border-radius: 10px;
    padding: 30px;
}
.app h1{
    font-size: 25px;
    color: #001e4d;
    font-weight: 600;
    border-bottom: 1px solid #333;
    padding-bottom: 30px;
}
.quiz{
    padding: 20px 0;
}
.quiz h2{
    font-size: 18px;
    color: #001e4d;
    font-weight: 600;
}
.btn{
    background: #fff;
    color: #222;
    font-weight: 500;
    width: 100%;
    border: 1px solid #222;
    padding: 10px;
    margin: 10px 0;
    text-align: left;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover:not([disabled]){
    background: #222;
    color: #fff;
}
.btn:disabled{
    cursor: no-drop;
}
#next-btn{
    background: #001e4d;
    color: #fff;
    font-weight: 500;
    width: 150px;
    border: 0;
    padding: 10px;
    margin: 20px auto 0;
    border-radius: 4px;
    cursor: pointer;
    display: none;
}
.correct{
    background: #9aeabc;
}
.incorrect{
    background: #ff9393;
}
    </style>
</head>

<body>
    
    <div class="app">
            <h1>Handout </h1>
            <div class="quiz">
                <h2 id="question">Question Goes Here</h2>
                <div id="answer-buttons">
                    <button class="btn">Answer 1</button>
                    <button class="btn">Answer 2</button>
                    <button class="btn">Answer 3</button>
                    <button class="btn">Answer 4</button>
                    <button class="btn">Answer 5</button>
                    <button class="btn">Answer 6</button>
                    <button class="btn">Answer 7</button>
                    <button class="btn">Answer 8</button>
                    <button class="btn">Answer 9</button>
                    <button class="btn">Answer 10</button>
                </div>
                <button id="next-btn">Next</button>
            </div>
        </div>

</body>
<script>

    const questions = [
    // --- Fundamentals ---
    {
        question: "What defines the structure for an app's user interface?",
        answers: [
            { text: "Context", correct: false},
            { text: "Layout", correct: true},
            { text: "Toast", correct: false},
            { text: "Notification", correct: false},
        ]
    },
    {
        question: "What is the component that draws something the user can see and interact with?",
        answers: [
            { text: "ViewGroup", correct: false},
            { text: "View", correct: true},
            { text: "Context", correct: false},
            { text: "App bar", correct: false},
        ]
    },
    {
        question: "What is an invisible container that defines the layout structure",
        answers: [
            { text: "View", correct: false},
            { text: "ViewGroup", correct: true},
            { text: "Snackbar", correct: false},
            { text: "Toast", correct: false},
        ]
    },
    {
        question: "Which term refers to an interface to global information about an application environment?",
        answers: [
            { text: "Layout", correct: false},
            { text: "ViewGroup", correct: false},
            { text: "Context", correct: true},
            { text: "Notification", correct: false},
        ]
    },
    {
        question: "Which size setting sets the view of the dimensions required by its content?",
        answers: [
            { text: "Match parent", correct: false},
            { text: "Wrap content", correct: true},
            { text: "Fixed width", correct: false},
            { text: "Fill screen", correct: false},
        ]
    },
    {
        question: "Which size setting sets the view to be as big as its parent view group allows?",
        answers: [
            { text: "Match parent", correct: true},
            { text: "Wrap content", correct: false},
            { text: "Constraint", correct: false},
            { text: "Table layout", correct: false},
        ]
    },
    // --- Layout Types ---
    {
        question: "Which layout is used to create large and complex layouts with a flat view hierarchy?",
        answers: [
            { text: "Linear layout", correct: false},
            { text: "Constraint layout", correct: true},
            { text: "Frame layout", correct: false},
            { text: "Table layout", correct: false},
        ]
    },
    {
        question: "Which layout organizes its child view elements into a single horizontal or vertical row?",
        answers: [
            { text: "Linear layout", correct: true},
            { text: "Grid layout", correct: false},
            { text: "Relative layout", correct: false},
            { text: "Web view", correct: false},
        ]
    },
    {
        question: "Which layout is used to specify the location of child objects relative to each other?",
        answers: [
            { text: "Relative layout", correct: true},
            { text: "Frame layout", correct: false},
            { text: "Linear layout", correct: false},
            { text: "Constraint layout", correct: false},
        ]
    },
    {
        question: "Which component is used specifically for displaying web pages within an app?",
        answers: [
            { text: "Table layout", correct: false},
            { text: "Web view", correct: true},
            { text: "Grid layout", correct: false},
            { text: "Frame layout", correct: false},
        ]
    },
    {
        question: "Which layout is designed to block out an area on the screen to display a single item?",
        answers: [
            { text: "Frame layout", correct: true},
            { text: "Linear layout", correct: false},
            { text: "Grid layout", correct: false},
            { text: "Relative layout", correct: false},
        ]
    },
    {
        question: "Which layout arranges child objects into rows and columns?",
        answers: [
            { text: "Table layout", correct: true},
            { text: "Linear layout", correct: false},
            { text: "Relative layout", correct: false},
            { text: "Frame layout", correct: false},
        ]
    },
    {
        question: "Which layout arranges objects in a rectangular grid that can be scrolled?",
        answers: [
            { text: "Table layout", correct: false},
            { text: "Grid layout", correct: true},
            { text: "Constraint layout", correct: false},
            { text: "Linear layout", correct: false},
        ]
    },
    // --- UI Elements and Feedback ---
    {
        question: "What is a message displayed outside the app's UI to provide reminders or communication?",
        answers: [
            { text: "Toast", correct: false},
            { text: "Notification", correct: true},
            { text: "Snackbar", correct: false},
            { text: "Dialog", correct: false},
        ]
    },
    {
        question: "What allows the user to view more details and take actions with a notification?",
        answers: [
            { text: "Notification drawer", correct: true},
            { text: "App bar", correct: false},
            { text: "Menu", correct: false},
            { text: "Grid layout", correct: false},
        ]
    },
    {
        question: "What provides a visual structure and interactive elements that are familiar to users at the top of the screen?",
        answers: [
            { text: "App bar", correct: true},
            { text: "Snackbar", correct: false},
            { text: "Context", correct: false},
            { text: "Web view", correct: false},
        ]
    },
    {
        question: "What provides simple feedback about an operation in a small popup?",
        answers: [
            { text: "Toast", correct: true},
            { text: "Dialog", correct: false},
            { text: "App bar", correct: false},
            { text: "Frame layout", correct: false},
        ]
    },
    {
        question: "Which element provides a quick pop-up message to the user?",
        answers: [
            { text: "Toast", correct: false},
            { text: "Snackbar", correct: true},
            { text: "Notification drawer", correct: false},
            { text: "Web view", correct: false},
        ]
    },
    {
        question: "What is a small window that prompts the user to make a decision or enter additional information?",
        answers: [
            { text: "Toast", correct: false},
            { text: "Dialog", correct: true},
            { text: "Menu", correct: false},
            { text: "App bar", correct: false},
        ]
    },
    {
        question: "What is used to present user actions and other options in app activities?",
        answers: [
            { text: "Menu", correct: true},
            { text: "Grid layout", correct: false},
            { text: "Context", correct: false},
            { text: "Snackbar", correct: false},
        ]
    }
];
    

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

const questionElement = document.getElementById("question");
const answerButtons = document.getElementById("answer-buttons");
const nextButton = document.getElementById("next-btn");

let currentQuestionIndex = 0;
let score = 0;

function startQuiz(){
    currentQuestionIndex = 0;
    score = 0;
    nextButton.innerHTML = "Next";

    shuffle(questions);
    questions.forEach(q => shuffle(q.answers));

    showQuestion();
}

function showQuestion(){
    resetState();
    let currentQuestion = questions[currentQuestionIndex];
    let questionNo = currentQuestionIndex + 1;
    questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

    currentQuestion.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerHTML = answer.text;
        button.classList.add("btn");
        answerButtons.appendChild(button);
        if(answer.correct){
            button.dataset.correct = answer.correct;
        }
        button.addEventListener("click", selectAnswer);
    });
}


function resetState(){
    nextButton.style.display = "none";
    while(answerButtons.firstChild){
        answerButtons.removeChild(answerButtons.firstChild);
    }
}

function selectAnswer(e){
    const selectedBtn = e.target;
    const isCorrect = selectedBtn.dataset.correct === "true";
    if(isCorrect){
        selectedBtn.classList.add("correct");
        score++;
    }else{
        selectedBtn.classList.add("incorrect");
    }
    Array.from(answerButtons.children).forEach(button => {
        if(button.dataset.correct === "true"){
            button.classList.add("correct");
        }
        button.disabled = true;
    });
    nextButton.style.display = "block";
}

function showScore(){
    resetState();
    questionElement.innerHTML = `You scored ${score} out of ${questions.length}!`;
    nextButton.innerHTML = "Play Again";
    nextButton.style.display = "block";
}

function handleNextButton(){
    currentQuestionIndex++;
    if(currentQuestionIndex < questions.length){
        showQuestion();
    }else{
        showScore();
    }
}


nextButton.addEventListener("click", ()=>{
    if(currentQuestionIndex < questions.length){
        handleNextButton();
    }else{
        startQuiz();
    }
});


startQuiz();

</script>
</html>
