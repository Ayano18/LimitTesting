<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Testing</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}
body{
    background: #001e4d;
}
.app{
    background: #fff;
    width: 90%;
    max-width: 600px;
    margin: 100px auto 0;
    border-radius: 10px;
    padding: 30px;
}
.app h1{
    font-size: 25px;
    color: #001e4d;
    font-weight: 600;
    border-bottom: 1px solid #333;
    padding-bottom: 30px;
}
.quiz{
    padding: 20px 0;
}
.quiz h2{
    font-size: 18px;
    color: #001e4d;
    font-weight: 600;
}
.btn{
    background: #fff;
    color: #222;
    font-weight: 500;
    width: 100%;
    border: 1px solid #222;
    padding: 10px;
    margin: 10px 0;
    text-align: left;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover:not([disabled]){
    background: #222;
    color: #fff;
}
.btn:disabled{
    cursor: no-drop;
}
#next-btn{
    background: #001e4d;
    color: #fff;
    font-weight: 500;
    width: 150px;
    border: 0;
    padding: 10px;
    margin: 20px auto 0;
    border-radius: 4px;
    cursor: pointer;
    display: none;
}
.correct{
    background: #9aeabc;
}
.incorrect{
    background: #ff9393;
}
    </style>
</head>

<body>
    
    <div class="app">
            <h1>Handout </h1>
            <div class="quiz">
                <h2 id="question">Question Goes Here</h2>
                <div id="answer-buttons">
                    <button class="btn">Answer 1</button>
                    <button class="btn">Answer 2</button>
                    <button class="btn">Answer 3</button>
                    <button class="btn">Answer 4</button>
                    <button class="btn">Answer 5</button>
                    <button class="btn">Answer 6</button>
                    <button class="btn">Answer 7</button>
                    <button class="btn">Answer 8</button>
                    <button class="btn">Answer 9</button>
                    <button class="btn">Answer 10</button>
                </div>
                <button id="next-btn">Next</button>
            </div>
        </div>

</body>
<script>

    const questions = [
    // --- Syntax and Source ---
    {
        question: "What is defined as the form of expressions, statements, and program units in a language?",
        answers: [
            { text: "Semantics", correct: false},
            { text: "Syntax", correct: true},
            { text: "Meta language", correct: false},
            { text: "Logic", correct: false},
        ]
    },
    {
        question: "What is a program written in a high-level programming language called?",
        answers: [
            { text: "Source file", correct: false},
            { text: "Meta language", correct: false},
            { text: "Source code", correct: true},
            { text: "Abstract tree", correct: false},
        ]
    },
    {
        question: "What is the file containing the source code called?",
        answers: [
            { text: "Source file", correct: true},
            { text: "Syntax file", correct: false},
            { text: "Binary file", correct: false},
            { text: "Production rule", correct: false},
        ]
    },
    // --- Language Components ---
    {
        question: "What are reserved words that have a special meaning in a programming language?",
        answers: [
            { text: "Identifiers", correct: false},
            { text: "Operators", correct: false},
            { text: "Keywords", correct: true},
            { text: "Punctuation", correct: false},
        ]
    },
    {
        question: "Which components are symbols that perform operations on variables and values?",
        answers: [
            { text: "Keywords", correct: false},
            { text: "Operators", correct: true},
            { text: "Identifiers", correct: false},
            { text: "BNF rules", correct: false},
        ]
    },
    {
        question: "Which category includes symbols such as commas, semicolons, and braces?",
        answers: [
            { text: "Punctuation", correct: true},
            { text: "Keywords", correct: false},
            { text: "Operators", correct: false},
            { text: "Production rules", correct: false},
        ]
    },
    {
        question: "What are names that identify user-defined items in a program?",
        answers: [
            { text: "Keywords", correct: false},
            { text: "Punctuation", correct: false},
            { text: "Identifiers", correct: true},
            { text: "Meta language", correct: false},
        ]
    },
    // --- Formal Descriptions ---
    {
        question: "What is a language or set of terms used to describe another language?",
        answers: [
            { text: "Source code", correct: false},
            { text: "Static semantics", correct: false},
            { text: "Meta language", correct: true},
            { text: "Axiomatic semantics", correct: false},
        ]
    },
    {
        question: "What are the core components of BNF grammar, also called production rules?",
        answers: [
            { text: "Static semantics", correct: false},
            { text: "BNF rules", correct: true},
            { text: "Abstract Syntax Trees", correct: false},
            { text: "Identifiers", correct: false},
        ]
    },
    {
        question: "What is a tree representation of the syntactic structure of source code?",
        answers: [
            { text: "BNF tree", correct: false},
            { text: "Semantic map", correct: false},
            { text: "Abstract Syntax Tree", correct: true},
            { text: "Source file", correct: false},
        ]
    },
    // --- Semantics ---
    {
        question: "What refers to the meaning of expressions, statements, and program units?",
        answers: [
            { text: "Syntax", correct: false},
            { text: "Punctuation", correct: false},
            { text: "Semantics", correct: true},
            { text: "Identifiers", correct: false},
        ]
    },
    {
        question: "Which type of semantics involves checking rules simultaneously, such as scope resolution?",
        answers: [
            { text: "Dynamic semantics", correct: false},
            { text: "Static semantics", correct: true},
            { text: "Operational semantics", correct: false},
            { text: "Denotational semantics", correct: false},
        ]
    },
    {
        question: "Which type of semantics refers to the behavior of a program when it is run?",
        answers: [
            { text: "Static semantics", correct: false},
            { text: "Dynamic semantics", correct: true},
            { text: "BNF rules", correct: false},
            { text: "Punctuation", correct: false},
        ]
    },
    {
        question: "Which semantics describes behavior in terms of abstract machine execution, step by step?",
        answers: [
            { text: "Denotational semantics", correct: false},
            { text: "Axiomatic semantics", correct: false},
            { text: "Operational semantics", correct: true},
            { text: "Static semantics", correct: false},
        ]
    },
    {
        question: "Which semantics maps syntactic constructs to mathematical objects for an abstract description?",
        answers: [
            { text: "Operational semantics", correct: false},
            { text: "Denotational semantics", correct: true},
            { text: "Axiomatic semantics", correct: false},
            { text: "Dynamic semantics", correct: false},
        ]
    },
    {
        question: "Which semantics uses logical assertions (preconditions/postconditions) to specify program properties?",
        answers: [
            { text: "Operational semantics", correct: false},
            { text: "Denotational semantics", correct: false},
            { text: "Axiomatic semantics", correct: true},
            { text: "Static semantics", correct: false},
        ]
    }
];
    

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

const questionElement = document.getElementById("question");
const answerButtons = document.getElementById("answer-buttons");
const nextButton = document.getElementById("next-btn");

let currentQuestionIndex = 0;
let score = 0;

function startQuiz(){
    currentQuestionIndex = 0;
    score = 0;
    nextButton.innerHTML = "Next";

    shuffle(questions);
    questions.forEach(q => shuffle(q.answers));

    showQuestion();
}

function showQuestion(){
    resetState();
    let currentQuestion = questions[currentQuestionIndex];
    let questionNo = currentQuestionIndex + 1;
    questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

    currentQuestion.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerHTML = answer.text;
        button.classList.add("btn");
        answerButtons.appendChild(button);
        if(answer.correct){
            button.dataset.correct = answer.correct;
        }
        button.addEventListener("click", selectAnswer);
    });
}


function resetState(){
    nextButton.style.display = "none";
    while(answerButtons.firstChild){
        answerButtons.removeChild(answerButtons.firstChild);
    }
}

function selectAnswer(e){
    const selectedBtn = e.target;
    const isCorrect = selectedBtn.dataset.correct === "true";
    if(isCorrect){
        selectedBtn.classList.add("correct");
        score++;
    }else{
        selectedBtn.classList.add("incorrect");
    }
    Array.from(answerButtons.children).forEach(button => {
        if(button.dataset.correct === "true"){
            button.classList.add("correct");
        }
        button.disabled = true;
    });
    nextButton.style.display = "block";
}

function showScore(){
    resetState();
    questionElement.innerHTML = `You scored ${score} out of ${questions.length}!`;
    nextButton.innerHTML = "Play Again";
    nextButton.style.display = "block";
}

function handleNextButton(){
    currentQuestionIndex++;
    if(currentQuestionIndex < questions.length){
        showQuestion();
    }else{
        showScore();
    }
}


nextButton.addEventListener("click", ()=>{
    if(currentQuestionIndex < questions.length){
        handleNextButton();
    }else{
        startQuiz();
    }
});


startQuiz();

</script>
</html>
