<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Testing</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}
body{
    background: #001e4d;
}
.app{
    background: #fff;
    width: 90%;
    max-width: 600px;
    margin: 100px auto 0;
    border-radius: 10px;
    padding: 30px;
}
.app h1{
    font-size: 25px;
    color: #001e4d;
    font-weight: 600;
    border-bottom: 1px solid #333;
    padding-bottom: 30px;
}
.quiz{
    padding: 20px 0;
}
.quiz h2{
    font-size: 18px;
    color: #001e4d;
    font-weight: 600;
}
.btn{
    background: #fff;
    color: #222;
    font-weight: 500;
    width: 100%;
    border: 1px solid #222;
    padding: 10px;
    margin: 10px 0;
    text-align: left;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
}
.btn:hover:not([disabled]){
    background: #222;
    color: #fff;
}
.btn:disabled{
    cursor: no-drop;
}
#next-btn{
    background: #001e4d;
    color: #fff;
    font-weight: 500;
    width: 150px;
    border: 0;
    padding: 10px;
    margin: 20px auto 0;
    border-radius: 4px;
    cursor: pointer;
    display: none;
}
.correct{
    background: #9aeabc;
}
.incorrect{
    background: #ff9393;
}
    </style>
</head>

<body>
    
    <div class="app">
            <h1>Handout </h1>
            <div class="quiz">
                <h2 id="question">Question Goes Here</h2>
                <div id="answer-buttons">
                    <button class="btn">Answer 1</button>
                    <button class="btn">Answer 2</button>
                    <button class="btn">Answer 3</button>
                    <button class="btn">Answer 4</button>
                    <button class="btn">Answer 5</button>
                    <button class="btn">Answer 6</button>
                    <button class="btn">Answer 7</button>
                    <button class="btn">Answer 8</button>
                    <button class="btn">Answer 9</button>
                    <button class="btn">Answer 10</button>
                </div>
                <button id="next-btn">Next</button>
            </div>
        </div>

</body>
<script>

    const questions = [
    // --- Activity Fundamentals ---
    {
        question: "What represents a single screen in an app where the user can perform a single focused task?",
        answers: [
            { text: "Service", correct: false},
            { text: "Activity", correct: true},
            { text: "Intent", correct: false},
            { text: "Back stack", correct: false},
        ]
    },
    {
        question: "Which activity is presented to the user when the app is launched?",
        answers: [
            { text: "Secondary activity", correct: false},
            { text: "Parent activity", correct: false},
            { text: "Main activity", correct: true},
            { text: "Target activity", correct: false},
        ]
    },
    {
        question: "What is the set of states an activity can be in during its entire lifetime?",
        answers: [
            { text: "Activity life cycle", correct: true},
            { text: "Back stack", correct: false},
            { text: "Intent flags", correct: false},
            { text: "Callback chain", correct: false},
        ]
    },
    // --- Lifecycle Callback Methods ---
    {
        question: "Which method is invoked when the app is launched for the first time and only happens once?",
        answers: [
            { text: "onStart()", correct: false},
            { text: "onResume()", correct: false},
            { text: "onCreate()", correct: true},
            { text: "onRestart()", correct: false},
        ]
    },
    {
        question: "Which method is invoked before the activity becomes visible to the user?",
        answers: [
            { text: "onStart()", correct: true},
            { text: "onPause()", correct: false},
            { text: "onDestroy()", correct: false},
            { text: "onCreate()", correct: false},
        ]
    },
    {
        question: "Which method is invoked before the activity starts interacting with the user?",
        answers: [
            { text: "onStart()", correct: false},
            { text: "onResume()", correct: true},
            { text: "onRestart()", correct: false},
            { text: "onStop()", correct: false},
        ]
    },
    {
        question: "Which method is invoked when the system is about to start resuming another activity?",
        answers: [
            { text: "onStop()", correct: false},
            { text: "onDestroy()", correct: false},
            { text: "onPause()", correct: true},
            { text: "onCreate()", correct: false},
        ]
    },
    {
        question: "Which method is invoked when the activity is no longer visible to the user?",
        answers: [
            { text: "onPause()", correct: false},
            { text: "onStop()", correct: true},
            { text: "onDestroy()", correct: false},
            { text: "onRestart()", correct: false},
        ]
    },
    {
        question: "Which method is invoked when the activity is finishing or being destroyed due to a configuration change?",
        answers: [
            { text: "onStop()", correct: false},
            { text: "onPause()", correct: false},
            { text: "onDestroy()", correct: true},
            { text: "onRestart()", correct: false},
        ]
    },
    {
        question: "Which method is invoked if the activity comes back after being stopped?",
        answers: [
            { text: "onCreate()", correct: false},
            { text: "onRestart()", correct: true},
            { text: "onResume()", correct: false},
            { text: "onStart()", correct: false},
        ]
    },
    // --- Back Stack and Intents ---
    {
        question: "Each time a new activity starts, the previous activity is stopped, but the system preserves the activity.",
        answers: [
            { text: "Activity life cycle", correct: false},
            { text: "Back stack", correct: true},
            { text: "Intent flags", correct: false},
            { text: "Parent activity", correct: false},
        ]
    },
    {
        question: "What is an asynchronous message used in an activity to request an action from another activity?",
        answers: [
            { text: "Intent", correct: true},
            { text: "Callback", correct: false},
            { text: "Flag", correct: false},
            { text: "Back stack", correct: false},
        ]
    },
    // --- Parts of an Intent ---
    {
        question: "In an intent, what refers to the activity that will receive?",
        answers: [
            { text: "Target activity", correct: true},
            { text: "Main activity", correct: false},
            { text: "Parent activity", correct: false},
            { text: "Implicit activity", correct: false},
        ]
    },
    {
        question: "What part of an intent contains a reference to the data you want the receiving activity to operate on?",
        answers: [
            { text: "Intent extras", correct: false},
            { text: "Intent flags", correct: false},
            { text: "Intent data/object", correct: true},
            { text: "Target activity", correct: false},
        ]
    },
    {
        question: "Which part of an intent carries specific information the receiving required to accomplish a requested action?",
        answers: [
            { text: "Intent flags", correct: false},
            { text: "Intent extras", correct: true},
            { text: "Intent data", correct: false},
            { text: "Target activity", correct: false},
        ]
    },
    {
        question: "Which part of an intent instructs the system how to launch or treat an activity after it's launched?",
        answers: [
            { text: "Intent flags", correct: true},
            { text: "Intent extras", correct: false},
            { text: "Intent data", correct: false},
            { text: "Target activity", correct: false},
        ]
    },
    // --- Types of Intent and Manifest ---
    {
        question: "What type of intent is used when the target of the intent is already identified?",
        answers: [
            { text: "Implicit intent", correct: false},
            { text: "Explicit intent", correct: true},
            { text: "Direct intent", correct: false},
            { text: "Main intent", correct: false},
        ]
    },
    {
        question: "What type of intent is not yet identified but there is a general action to perform?",
        answers: [
            { text: "Explicit intent", correct: false},
            { text: "Implicit intent", correct: true},
            { text: "Broadcast intent", correct: false},
            { text: "Target intent", correct: false},
        ]
    },
    {
        question: "Which attribute indicates that the main activity is the parent of the second activity?",
        answers: [
            { text: "MainActivity", correct: false},
            { text: "ChildActivityName", correct: false},
            { text: "ParentActivityName", correct: true},
            { text: "TargetActivity", correct: false},
        ]
    }
];
    

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

const questionElement = document.getElementById("question");
const answerButtons = document.getElementById("answer-buttons");
const nextButton = document.getElementById("next-btn");

let currentQuestionIndex = 0;
let score = 0;

function startQuiz(){
    currentQuestionIndex = 0;
    score = 0;
    nextButton.innerHTML = "Next";

    shuffle(questions);
    questions.forEach(q => shuffle(q.answers));

    showQuestion();
}

function showQuestion(){
    resetState();
    let currentQuestion = questions[currentQuestionIndex];
    let questionNo = currentQuestionIndex + 1;
    questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

    currentQuestion.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerHTML = answer.text;
        button.classList.add("btn");
        answerButtons.appendChild(button);
        if(answer.correct){
            button.dataset.correct = answer.correct;
        }
        button.addEventListener("click", selectAnswer);
    });
}


function resetState(){
    nextButton.style.display = "none";
    while(answerButtons.firstChild){
        answerButtons.removeChild(answerButtons.firstChild);
    }
}

function selectAnswer(e){
    const selectedBtn = e.target;
    const isCorrect = selectedBtn.dataset.correct === "true";
    if(isCorrect){
        selectedBtn.classList.add("correct");
        score++;
    }else{
        selectedBtn.classList.add("incorrect");
    }
    Array.from(answerButtons.children).forEach(button => {
        if(button.dataset.correct === "true"){
            button.classList.add("correct");
        }
        button.disabled = true;
    });
    nextButton.style.display = "block";
}

function showScore(){
    resetState();
    questionElement.innerHTML = `You scored ${score} out of ${questions.length}!`;
    nextButton.innerHTML = "Play Again";
    nextButton.style.display = "block";
}

function handleNextButton(){
    currentQuestionIndex++;
    if(currentQuestionIndex < questions.length){
        showQuestion();
    }else{
        showScore();
    }
}


nextButton.addEventListener("click", ()=>{
    if(currentQuestionIndex < questions.length){
        handleNextButton();
    }else{
        startQuiz();
    }
});


startQuiz();

</script>
</html>
